name: ApiBump
description: Detect public API breakages and recommend SemVer bumps.
author: ApiBump

branding:
  icon: shield
  color: orange

inputs:
  language:
    description: "Language backend to run. V1 supports python."
    required: false
    default: python
  package:
    description: "Python package/module name to check. Optional when autodetect or config can resolve it."
    required: false
  search:
    description: "Search path passed to Griffe, usually src or . Optional when autodetect or config can resolve it."
    required: false
    default: ""
  config:
    description: "Optional apibump.toml path relative to the repository root."
    required: false
    default: ""
  all-packages:
    description: "Check all configured or detected packages instead of only changed ones."
    required: false
    default: "false"
  base:
    description: "Older git ref to compare from."
    required: true
  head:
    description: "Newer git ref to compare to."
    required: false
    default: HEAD
  fail-on:
    description: "Failure policy: breaking, unknown, or never."
    required: false
    default: breaking
  comment:
    description: "Post or update a sticky PR comment."
    required: false
    default: "true"
  github-token:
    description: "Token used for PR comments."
    required: false
    default: ""
  format:
    description: "Log output format: human, json, markdown, or github."
    required: false
    default: github
  version:
    description: "ApiBump release version to download."
    required: false
    default: v0.1.0

outputs:
  recommendation:
    description: "Recommended SemVer bump."
    value: ${{ steps.run.outputs.recommendation }}
  breaking:
    description: "Number of breaking changes."
    value: ${{ steps.run.outputs.breaking }}
  unknown:
    description: "Number of unknown changes."
    value: ${{ steps.run.outputs.unknown }}
  json-file:
    description: "Path to the JSON report on the runner."
    value: ${{ steps.run.outputs.json_file }}
  markdown-file:
    description: "Path to the Markdown report on the runner."
    value: ${{ steps.run.outputs.markdown_file }}
  exit-code:
    description: "ApiBump CLI exit code after applying the failure policy."
    value: ${{ steps.run.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Install ApiBump
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install-cli.sh"

    - name: Setup uv
      uses: astral-sh/setup-uv@v6

    - name: Run ApiBump
      id: run
      shell: bash
      env:
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_SEARCH: ${{ inputs.search }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ALL_PACKAGES: ${{ inputs.all-packages }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-run.sh"

    - name: Comment on PR
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_FILE: ${{ steps.run.outputs.markdown_file }}
      run: bash "$GITHUB_ACTION_PATH/scripts/comment-pr.sh"

    - name: Apply failure policy
      if: ${{ steps.run.outputs.exit_code != '0' }}
      shell: bash
      run: exit "${{ steps.run.outputs.exit_code }}"
