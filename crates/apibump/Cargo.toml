[package]
name = "apibump"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Detect semantic public API changes and recommend SemVer bumps."
readme = "../../README.md"
keywords = ["api", "semver", "breaking-change", "github-action", "python"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "2.0"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
pretty_assertions = "1.4"
