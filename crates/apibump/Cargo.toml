[package]
name = "apibump"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Detect semantic public API changes and recommend SemVer bumps."
readme = "../../README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "2.0"

[dev-dependencies]
pretty_assertions = "1.4"

