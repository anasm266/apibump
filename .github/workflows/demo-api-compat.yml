name: Demo API compatibility

on:
  pull_request:
    paths:
      - "demo/python/**"
      - ".github/workflows/demo-api-compat.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  apibump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anasm266/apibump@v1
        with:
          package: demo_pkg
          search: demo/python/src
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.sha }}
          comment: true

