name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m pip install "griffe>=1,<2"
      - run: python3 crates/apibump/python/test_bridge.py
      - run: cargo fmt --check
      - run: cargo test --locked
