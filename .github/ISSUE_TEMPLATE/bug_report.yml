name: Bug report
description: Report a reproducible ApiBump bug.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, workflow snippet, or minimal repository shape.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ApiBump version
      placeholder: v0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Logs or report output
      render: text

